<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PretendAI · Leaderboard</title>
<link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body class="board" id="body">
  <header class="nav">
    <a class="brand logo-link" href="/" title="PretendAI - The Reverse Turing Test">
      <img src="/assets/logo.png" alt="PretendAI Logo" class="logo-img" />
    </a>
    <nav>
      <a href="/">Home</a>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
    </nav>
  </header>
  <main class="board-wrap">
    <h1>Most Artificial Minds</h1>
    <p class="sub">Top scores and the latest attempts. Pick a mode.</p>

    <div class="tabs" id="modeTabs">
      <button class="tab active" data-mode="all">All</button>
      <button class="tab" data-mode="classic">Classic</button>
      <button class="tab" data-mode="interview">Interview</button>
      <button class="tab" data-mode="chaos">Chaos</button>
      <button class="tab" data-mode="jailbreak">Jailbreak</button>
    </div>

    <div class="board-cols">
      <section>
        <h3 class="col-h">Top scores</h3>
        <ol id="boardTop" class="board-list"></ol>
      </section>
      <section>
        <h3 class="col-h">Recent</h3>
        <ol id="boardRecent" class="board-list"></ol>
      </section>
    </div>
  </main>

  <footer>
    <span>PretendAI · how artificial are you?</span>
    <span style="margin-top:12px;display:block;font-size:12px">
      <a href="https://github.com/MKishoreDev" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);transition:color .2s;margin-left:6px">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="display:inline">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        MKishoreDev
      </a>
    </span>
  </footer>

  <script>
    // Dark/Light Mode Toggle
    function initTheme(){
      const isDark = localStorage.getItem('pretendai-theme') !== 'light';
      const html = document.documentElement;
      const toggle = document.getElementById('themeToggle');
      
      if (!isDark) html.classList.add('light-mode');
      
      toggle.addEventListener('click', () => {
        const isLight = html.classList.contains('light-mode');
        html.classList.toggle('light-mode');
        localStorage.setItem('pretendai-theme', isLight ? 'dark' : 'light');
        toggle.textContent = isLight ? '🌙' : '☀️';
      });
      
      toggle.textContent = isDark ? '🌙' : '☀️';
    }
    initTheme();

    // Leaderboard functionality
    const topEl = document.getElementById('boardTop');
    const recentEl = document.getElementById('boardRecent');
    const tabs = document.getElementById('modeTabs');

    function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    function render(list, target){
      if (!list.length){
        target.innerHTML = '<div class="empty">No scores yet here.</div>';
        return;
      }
      target.innerHTML = '';
      for (const e of list){
        const li = document.createElement('li');
        li.innerHTML = `<span class="who">${escapeHtml(e.name)}</span>
                        <span class="mode">${e.mode}</span>
                        <span class="rank-pill">${escapeHtml(e.rank)}</span>
                        <span class="score">${e.final}</span>`;
        target.appendChild(li);
      }
    }

    async function load(mode){
      topEl.innerHTML = recentEl.innerHTML = '<div class="empty">Loading…</div>';
      try {
        const r = await fetch('/api/leaderboard' + (mode && mode!=='all' ? `?mode=${mode}` : ''));
        const data = await r.json();
        render(data.top || [], topEl);
        render(data.recent || [], recentEl);
      } catch {
        topEl.innerHTML = recentEl.innerHTML = '<div class="empty">Something happened, try again.</div>';
      }
    }

    tabs.addEventListener('click', (e) => {
      const b = e.target.closest('.tab'); if (!b) return;
      tabs.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === b));
      load(b.dataset.mode);
    });
    load('all');
  </script>
</body>
</html>
